name: Auto Update Peta Banjir Semarang

on:
  schedule:
    # Berjalan otomatis setiap 12 jam (pukul 00:00 dan 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" manual di GitHub

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api geemap pandas

      - name: Run Realtime Flood Monitor
        env:
          EARTHENGINE_SERVICE_ACCOUNT: ${{ secrets.EARTHENGINE_SERVICE_ACCOUNT }}
          EARTHENGINE_PRIVATE_KEY: ${{ secrets.EARTHENGINE_PRIVATE_KEY }}
        run: |
          python realtime_flood_monitor.py

      - name: Commit and Push Updated Map
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add peta_realtime_semarang.html index.html
          git commit -m "Auto-update peta kerentanan banjir Semarang [skip ci]" || echo "Tidak ada perubahan baru"
          git push